<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img">
  <title>RTT Jogja organization banner</title>
  <desc>A colorful banner with geometric motifs, a sunrise, and a mountain landscape.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073b4c"/>
      <stop offset="0.56" stop-color="#0f6b68"/>
      <stop offset="1" stop-color="#168c8c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e76f51"/>
      <stop offset="1" stop-color="#d94f4f"/>
    </linearGradient>
    <pattern id="weave" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M32 4 60 32 32 60 4 32Z" fill="none" stroke="#fff3d6" stroke-width="2"/>
      <circle cx="32" cy="32" r="5" fill="#ffd166"/>
      <circle cx="4" cy="4" r="3" fill="#ef8354"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#sky)"/>
    <rect x="-20" y="-20" width="340" height="400" fill="url(#weave)" opacity="0.16"/>
    <path d="M0 294C158 245 255 322 398 280s238-21 367 24 280-45 435-10v66H0Z" fill="#062f3d" opacity="0.74"/>

    <circle cx="970" cy="127" r="78" fill="url(#sun)"/>
    <circle cx="970" cy="127" r="98" fill="none" stroke="#fff3d6" stroke-width="3" opacity="0.38"/>
    <path d="M708 304 887 150l45 48 44-76 165 182Z" fill="url(#ridge)"/>
    <path d="m887 150 45 48 44-76 27 53-28-12-17 28-24 19Z" fill="#fff3d6" opacity="0.92"/>
    <path d="M735 304 879 185l48 51 49-84 139 152Z" fill="#073b4c" opacity="0.5"/>

    <path d="M668 276h48v-34h48v-39h48v-44" fill="none" stroke="#ffd166" stroke-width="8" stroke-linejoin="round"/>
    <path d="m797 170 15-15 15 15" fill="none" stroke="#ffd166" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="65" y="52" width="12" height="82" rx="6" fill="#ffd166"/>
    <text x="101" y="130" fill="#fff3d6" font-family="Palatino Linotype, Book Antiqua, Georgia, serif" font-size="76" font-weight="700" letter-spacing="2">RTT <tspan fill="#ffd166">JOGJA</tspan></text>
    <text x="101" y="178" fill="#fff3d6" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700" letter-spacing="3">CREATE MORE ENTREPRENEURS IN JOGJA</text>
    <path d="M101 207h470" stroke="#ef8354" stroke-width="5" stroke-linecap="round"/>

    <rect x="101" y="237" width="530" height="52" rx="26" fill="#fff3d6"/>
    <circle cx="134" cy="263" r="11" fill="#e76f51"/>
    <circle cx="166" cy="263" r="11" fill="#ffd166"/>
    <circle cx="198" cy="263" r="11" fill="#168c8c"/>
    <text x="228" y="271" fill="#073b4c" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700" letter-spacing="1.5">CONNECT &#183; COLLABORATE &#183; BUILD</text>
  </g>
</svg>
